# Blueprint de Render — crea la base de datos y el servidor de un solo
# clic ("New +" → "Blueprint" → conectar este repo). No hace falta tocar
# nada más: DATABASE_URL y JWT_SECRET se generan y conectan solos.
# APPLE_CLIENT_ID usa el Bundle ID nativo de SabStab. RESEND_API_KEY se
# agrega a mano en el dashboard de Render (Environment → Add). Sin ella, recuperar
# contraseña responde 501 en vez de fingir que mandó el correo.
databases:
  - name: sabstab-db
    plan: free
    databaseName: sabstab
    user: sabstab

services:
  - type: web
    name: sabstab-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node migrate.js && node seed-exercises.js && node server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sabstab-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APPLE_CLIENT_ID
        value: com.sabstab.app
      - key: RESEND_API_KEY
        sync: false
